name: Alpha bug report
description: Report a problem found while testing HA Forensic Lab
title: "[alpha] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing HA Forensic Lab.

        **Do not paste Home Assistant access tokens or raw Home Assistant trace payloads.**
        Prefer HA Forensic Lab's native diagnostics and, when relevant, its safe incident export.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.x"
    validations:
      required: true

  - type: input
    id: forensic_version
    attributes:
      label: HA Forensic Lab version / commit
      placeholder: "tag, HACS version, or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS custom repository
        - Manual custom_components copy
        - Development checkout
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Keep the sequence concrete and minimal.
      placeholder: |
        1. Open ...
        2. Trigger ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Paste HA Forensic Lab's native Home Assistant diagnostics if available. This payload is designed not to contain forensic identifiers.
      render: json

  - type: textarea
    id: export
    attributes:
      label: Safe incident export
      description: If the issue concerns one incident, attach the safe ZIP generated by HA Forensic Lab. Do not attach raw HA traces.

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Logs are useful, but redact unrelated secrets/private values before posting.
