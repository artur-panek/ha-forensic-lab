name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          ignore: "topics"

  ha_compat:
    name: HA 2026.9.4 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install released Home Assistant
        run: python -m pip install homeassistant==2026.9.4 pytest
      - name: Check schemas and storage against Home Assistant
        run: python -m pytest -q tests/ha_runtime

  lint:
    name: Code checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: Install development checks
        run: python -m pip install pytest ruff
      - name: Ruff
        run: ruff check custom_components tests scripts/build_release.py
      - name: Compile Python
        run: python -m compileall -q custom_components scripts/build_release.py
      - name: Check JavaScript syntax
        run: |
          for source in custom_components/ha_forensic_lab/frontend/*.js custom_components/ha_forensic_lab/frontend/*.mjs scripts/alpha-smoke.mjs; do
            node --check "$source"
          done
      - name: Frontend unit tests
        run: node --test tests/js/*.mjs
      - name: Repository tests
        run: pytest -q
      - name: Build release archive
        run: python scripts/build_release.py --output dist

      - name: Upload exact candidate package
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: ha-forensic-lab-candidate-${{ github.sha }}
          path: |
            dist/ha-forensic-lab.zip
            dist/ha-forensic-lab.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
