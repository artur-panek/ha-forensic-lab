name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          ignore: "description topics"

  lint:
    name: Code checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: Install development checks
        run: python -m pip install pytest ruff
      - name: Ruff
        run: ruff check custom_components tests
      - name: Compile Python
        run: python -m compileall -q custom_components
      - name: Check JavaScript syntax
        run: |
          node --check custom_components/ha_forensic_lab/frontend/ha-forensic-lab-panel.js
          node --check custom_components/ha_forensic_lab/frontend/trace-projection.mjs
          node --check scripts/alpha-smoke.mjs
      - name: Frontend unit tests
        run: node tests/js/test_trace_projection.mjs
      - name: Repository tests
        run: pytest -q
